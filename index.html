<style id="text-animations-v3">
/* === بدون تقطيع حروف عربي - الكلمة تتحرك كاملة === */

@keyframes fadeUpIn {
  0% { opacity: 0; transform: translateY(28px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes slideRightIn {
  0% { opacity: 0; transform: translateX(-30px); }
  100% { opacity: 1; transform: translateX(0); }
}
@keyframes slideLeftIn {
  0% { opacity: 0; transform: translateX(30px); }
  100% { opacity: 1; transform: translateX(0); }
}
@keyframes scaleIn {
  0% { opacity: 0; transform: scale(0.88); }
  100% { opacity: 1; transform: scale(1); }
}

/* حركات مستمرة للكلمة كاملة - بدون تقطيع */
@keyframes floatY {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes floatYSubtle {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
@keyframes softPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}
@keyframes shimmerMove {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(120%); }
}
@keyframes bounceGentle {
  0%,100% { transform: translateY(0); }
  25% { transform: translateY(-4px); }
  75% { transform: translateY(2px); }
}
@keyframes wiggle {
  0%,100% { transform: rotate(0deg); }
  25% { transform: rotate(1deg); }
  75% { transform: rotate(-1deg); }
}

/* كلاسات ظهور */
.reveal-up { animation: fadeUpIn 0.85s cubic-bezier(0.16,1,0.3,1) forwards; }
.reveal-right { animation: slideRightIn 0.8s cubic-bezier(0.16,1,0.3,1) forwards; }
.reveal-left { animation: slideLeftIn 0.8s cubic-bezier(0.16,1,0.3,1) forwards; }
.reveal-scale { animation: scaleIn 0.7s cubic-bezier(0.16,1,0.3,1) forwards; }

/* حركات مستمرة - للكلمة كاملة */
.float-continuous { animation: floatY 3s ease-in-out infinite; }
.float-subtle { animation: floatYSubtle 3.5s ease-in-out infinite; display: inline-block; }
.pulse-soft { animation: softPulse 2.8s ease-in-out infinite; display: inline-block; }
.bounce-gentle { animation: bounceGentle 2.5s ease-in-out infinite; display: inline-block; }
.wiggle-soft { animation: wiggle 3s ease-in-out infinite; display: inline-block; }

/* تأخيرات */
.d-1 { animation-delay: 0.1s; }
.d-2 { animation-delay: 0.2s; }
.d-3 { animation-delay: 0.3s; }
.d-4 { animation-delay: 0.4s; }

/* لمعة بدون تغيير لون - للكلمة كاملة */
.shine-wrap {
  position: relative;
  display: inline-block;
  overflow: hidden;
}
.shine-wrap::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  transform: translateX(-120%);
  animation: shimmerMove 3s ease-in-out infinite;
  pointer-events: none;
}

/* ضمان عدم اختفاء */
.reveal-up, .reveal-right, .reveal-left, .reveal-scale,
.float-continuous, .float-subtle, .pulse-soft, .bounce-gentle, .wiggle-soft {
  opacity: 1 !important;
  visibility: visible !important;
}

/* مهم للعربي: منع تقطيع */
.keep-arabic {
  display: inline-block;
  white-space: nowrap;
  word-break: keep-all;
}
</style>

                  setTimeout(() => { el.classList.add('float-continuous'); }, 300);
                } else if (el.tagName === 'H2') {
                  setTimeout(() => { el.classList.add('float-subtle'); }, 400);
                }
                el.removeEventListener('animationend', handler);
              }
            });
          }
          observer.unobserve(el);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });

    // H1 - لمعة + طفو
    document.querySelectorAll('h1').forEach((h) => {
      h.dataset.anim = 'reveal-up';
      h.classList.add('shine-wrap');
      observer.observe(h);
    });

    // H2
    document.querySelectorAll('h2').forEach((h, i) => {
      h.dataset.anim = i % 2 === 0 ? 'reveal-right' : 'reveal-left';
      h.style.animationDelay = (i % 3 * 0.12) + 's';
      observer.observe(h);
    });

    // H3 - نبضة مستمرة للكلمة كاملة
    document.querySelectorAll('h3').forEach((h, i) => {
      h.dataset.anim = 'reveal-scale';
      h.style.animationDelay = (i % 4 * 0.08 + 0.1) + 's';
      observer.observe(h);
      h.addEventListener('animationend', () => {
        setTimeout(() => h.classList.add('pulse-soft'), 500);
      }, { once: true });
    });

    // الفقرات
    document.querySelectorAll('p').forEach((p, i) => {
      if (p.textContent.trim().length > 10) {
        p.dataset.anim = 'reveal-up';
        p.style.animationDelay = (i % 5 * 0.05) + 's';
        observer.observe(p);
      }
    });

    // البادجات والكلمات المميزة - حركة للكلمة كاملة بدون تقطيع
    let count = 0;
    document.querySelectorAll('span, div').forEach(el => {
      if (el.children.length !== 0) return;
      const text = el.textContent.trim();
      if (text.length < 2 || text.length > 30) return;
      if (!/[\u0600-\u06FF]/.test(text)) return;
      const cls = el.className;
      const isBadge = cls.includes('rounded') || cls.includes('badge') || (cls.includes('px-') && cls.includes('py-'));
      const isBold = cls.includes('font-bold') || cls.includes('font-semibold') || cls.includes('font-extrabold');
      
      if ((isBadge || isBold) && count < 15) {
        // لا نقسم الحروف - نضيف حركة للكلمة كاملة
        el.classList.add('keep-arabic');
        // نوع حركة مختلف لكل كلمة
        const moves = ['float-subtle', 'pulse-soft', 'bounce-gentle', 'wiggle-soft'];
        const moveClass = moves[count % moves.length];
        el.classList.add(moveClass);
        el.style.animationDelay = (count * 0.15) + 's';
        count++;
      }
    });

    // الأزرار
    document.querySelectorAll('button, a').forEach((btn, i) => {
      const txt = btn.textContent.trim();
      if (txt.length > 0 && txt.length < 50 && btn.children.length <= 2) {
        btn.dataset.anim = 'reveal-scale';
        btn.style.animationDelay = (0.2 + (i % 4)*0.08) + 's';
        observer.observe(btn);
        btn.addEventListener('animationend', () => {
          if (i % 2 === 0) {
            setTimeout(() => btn.classList.add('bounce-gentle'), 600);
          }
        }, { once: true });
      }
    });

    // القوائم
    document.querySelectorAll('li').forEach((li, i) => {
      if (li.textContent.trim().length > 5) {
        li.dataset.anim = 'reveal-right';
        li.style.animationDelay = (i % 6 * 0.07) + 's';
        observer.observe(li);
      }
    });
  }
});
</script>

</body>
</html>
